[project]
name = "coldcase"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "anthropic>=2.5.0",
    "astropy>=8.0.2",
    "duckdb>=2.0.0",
    "fsspec>=2026.9.0",
    "h5py>=3.16.0",
    "hdf5plugin>=7.1.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pyarrow>=26.0.1",
    "typesafe-sdk>=0.7.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coldcase"]
